[package]
name = "quple"
version = "0.1.0"
description = "Desktop app that calls other Quple users over Jitsi Meet"
authors = ["Quple"]
edition = "2021"

[lib]
name = "quple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openidconnect = "4"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "macros"] }

[features]
# This feature is used for production builds or when `devPath` points to the
# filesystem and the built-in dev server is disabled.
custom-protocol = ["tauri/custom-protocol"]
